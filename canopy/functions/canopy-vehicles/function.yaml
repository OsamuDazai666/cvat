spec:
  description: "SAM 3 proposals + Qwen closed-set class (auto_v1 recipe)"
  runtime: 'python:3.12'
  handler: main:handler
  eventTimeout: 600s
  env:
    - name: PYTHONPATH
      value: /opt/nuclio:/opt/canopy_fn
  build:
    image: canopy-cvat/fn-canopy-vehicles:latest
    baseImage: canopy-cvat/fn-base:latest
    directives:
      preCopy:
        - kind: WORKDIR
          value: /opt/nuclio
  volumes:
    - volume:
        name: canopy-fn-common
        hostPath:
          path: "/run/desktop/mnt/host/d/canopy-cvat/cvat/canopy/functions/common"
      volumeMount:
        name: canopy-fn-common
        mountPath: /opt/canopy_fn
        readOnly: true
    - volume:
        name: canopy-tools
        hostPath:
          path: "/run/desktop/mnt/host/d/canopy-evidence/tools"
      volumeMount:
        name: canopy-tools
        mountPath: /canopy/tools
        readOnly: true
  triggers:
    myHttpTrigger:
      numWorkers: 1
      kind: http
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 67108864
  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
