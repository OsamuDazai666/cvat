# generated by functions/gen.py — edit gen.py/specs.py instead
metadata:
  name: canopy-sam3-interactor
  namespace: cvat
  annotations:
    name: "SAM 3 (canopy)"
    type: interactor
    version: 2
    spec:
    min_pos_points: "0"
    min_neg_points: "0"
    startswith_box_optional: "true"
    help_message: "SAM 3: positive/negative clicks, optionally start with a box"

spec:
  description: "SAM 3 masks from clicks / a box (model in canopy-models)"
  runtime: 'python:3.12'
  handler: main:handler
  eventTimeout: 60s
  env:
    - name: PYTHONPATH
      value: /opt/nuclio:/opt/canopy_fn
  build:
    image: canopy-cvat/fn-sam3-interactor:latest
    baseImage: canopy-cvat/fn-base:latest
    directives:
      preCopy:
        - kind: WORKDIR
          value: /opt/nuclio
  volumes:
    - volume:
        name: canopy-fn-common
        hostPath:
          path: "/run/desktop/mnt/host/d/canopy-cvat/cvat/canopy/functions/common"
      volumeMount:
        name: canopy-fn-common
        mountPath: /opt/canopy_fn
        readOnly: true
    - volume:
        name: canopy-tools
        hostPath:
          path: "/run/desktop/mnt/host/d/canopy-evidence/tools"
      volumeMount:
        name: canopy-tools
        mountPath: /canopy/tools
        readOnly: true
  triggers:
    myHttpTrigger:
      numWorkers: 2
      kind: http
      workerAvailabilityTimeoutMilliseconds: 10000
      attributes:
        maxRequestBodySize: 67108864
  platform:
    attributes:
      restartPolicy:
        name: always
        maximumRetryCount: 3
      mountMode: volume
